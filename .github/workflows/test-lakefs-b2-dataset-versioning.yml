name: Test lakefs-b2-dataset-versioning notebook

on:
  push:
    branches: [main]
    paths:
      - "lakefs-b2-dataset-versioning/**"
      - ".github/workflows/test-lakefs-b2-dataset-versioning.yml"
  pull_request:
    paths:
      - "lakefs-b2-dataset-versioning/**"
      - ".github/workflows/test-lakefs-b2-dataset-versioning.yml"
  workflow_dispatch:

concurrency:
  group: test-lakefs-b2-dataset-versioning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Execute lakefs_b2_dataset_versioning.ipynb against backblaze-samples-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lakefs
          POSTGRES_PASSWORD: lakefs
          POSTGRES_DB: lakefs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lakefs -d lakefs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      lakefs:
        image: treeverse/lakefs:1.34
        env:
          LAKEFS_DATABASE_TYPE: postgres
          LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: postgres://lakefs:lakefs@postgres:5432/lakefs?sslmode=disable
          # Blockstore configured to talk to backblaze-samples-ci in us-east-005.
          LAKEFS_BLOCKSTORE_TYPE: s3
          LAKEFS_BLOCKSTORE_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          LAKEFS_BLOCKSTORE_S3_REGION: us-east-005
          LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
          LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT: https://s3.us-east-005.backblazeb2.com
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${{ secrets.CI_KEY_ID }}
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${{ secrets.CI_APP_KEY }}
          # First-run admin user is created by an explicit POST in the
          # "Initialize lakeFS admin user" step below; lakeFS 1.34 does not
          # have a self-bootstrap env var that creates it.
          LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ci-only-not-secret-do-not-reuse
          LAKEFS_LOGGING_LEVEL: INFO
        ports:
          - 8000:8000
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:8000/_health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      AWS_EC2_METADATA_DISABLED: "true"
      # Both lakeFS and the notebook's optional verification cell target the
      # backblaze-samples-ci bucket in us-east-005.
      AWS_DEFAULT_REGION: us-east-005
      AWS_REGION: us-east-005
      AWS_ACCESS_KEY_ID: ${{ secrets.CI_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_APP_KEY }}
      AWS_ENDPOINT_URL_S3: https://s3.us-east-005.backblazeb2.com
      LAKEFS_ENDPOINT_URL: http://localhost:8000
      # Non-AWS-shaped to avoid matching secret-scanner patterns; lakeFS accepts
      # any free-form strings here (swagger AccessKeyCredentials: minLength 1).
      LAKEFS_ACCESS_KEY_ID: ci-lakefs-admin
      LAKEFS_SECRET_ACCESS_KEY: ci-lakefs-admin-secret
      B2_LAKEFS_DATA_BUCKET: backblaze-samples-ci
      PRIVATE_B2_REGION: us-east-005
      LAKEFS_NB_NUM_TILES: "100"
      # Per-run repo + storage prefix so concurrent runs cannot collide and
      # cleanup deletes only this run's data; matches the ci/ prefix lifecycle
      # rule documented in CLAUDE.md.
      LAKEFS_NB_REPO_NAME: ci-lakefs-${{ github.run_id }}-${{ github.run_attempt }}
      LAKEFS_NB_STORAGE_NAMESPACE: s3://backblaze-samples-ci/ci/lakefs-b2/run-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lakefs-b2-dataset-versioning/requirements.txt

      - name: Install notebook deps + test runner
        working-directory: lakefs-b2-dataset-versioning
        run: |
          pip install -r requirements.txt
          pip install nbmake pytest awscli

      - name: Wait for lakeFS to be reachable
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/_health >/dev/null; then
              echo "lakeFS healthy after ${i} tries."
              exit 0
            fi
            sleep 2
          done
          echo "::error::lakeFS did not become healthy in 60s."
          exit 1

      - name: Initialize lakeFS admin user
        run: |
          set -e
          body=$(printf '{"username":"admin","key":{"access_key_id":"%s","secret_access_key":"%s"}}' \
            "$LAKEFS_ACCESS_KEY_ID" "$LAKEFS_SECRET_ACCESS_KEY")
          code=$(curl -sS -o /tmp/setup-resp.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/v1/setup_lakefs \
            -H 'Content-Type: application/json' \
            -d "$body")
          case "$code" in
            200|409) echo "lakeFS setup OK (HTTP $code)" ;;
            *) echo "::error::lakeFS setup failed (HTTP $code)"; cat /tmp/setup-resp.json; exit 1 ;;
          esac

      - name: Execute notebook with nbmake
        working-directory: lakefs-b2-dataset-versioning
        run: |
          pytest -s --nbmake --nbmake-timeout=300 -v lakefs_b2_dataset_versioning.ipynb

      - name: Cleanup CI lakeFS data from B2 (always, even on failure)
        if: always()
        run: |
          aws s3 rm \
            "${LAKEFS_NB_STORAGE_NAMESPACE}/" \
            --recursive \
            --endpoint-url "${AWS_ENDPOINT_URL_S3}" \
            || echo "::warning::Cleanup partial; bucket lifecycle rule will handle the rest."
